name: CORTEX CI/CD Tests & Code Audit

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-audit:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.audit_deps/browsers

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pypdf
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Install isolated Chromium for dynamic-page tests
        run: python -m playwright install chromium

      - name: 🔍 Lint with Flake8 (Syntax & Undefined Names)
        run: |
          # التوقف إذا كان هناك أخطاء برمجية أو متغيرات غير معرّفة
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics "--exclude=.git,__pycache__,staj 1,.audit_deps"

      - name: Run regression and integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Replay synthetic policy evaluation
        run: python -m evaluation.run --output output/evaluation/policy.json

      - name: 🧪 Run QA Automated Test Suite
        run: |
          python qa_test.py

      - name: 🚀 Run URL & Form Logic Tests
        run: |
          python test_fixed.py

      - name: 🛡️ Verify Core Modules Import Integrity
        run: |
          python -c "import main; print('[OK] main.py is intact')"
          python -c "import gui_main; print('[OK] gui_main.py is intact')"
